<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
    <style>
        body {
            background-color: #2b2b2b;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
            cursor: default;
        }
        .textLayer {
            position: absolute;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="pdfCanvas"></canvas>
    <div id="textLayer" class="textLayer"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        const pdfCanvas = document.getElementById('pdfCanvas');
        const textLayer = document.getElementById('textLayer');
        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;
        let scale = 1.0;
        let continuousMode = false;

        function renderPage(num) {
            pageRendering = true;
            pdfDoc.getPage(num).then(function (page) {
                const viewport = page.getViewport({ scale: scale });
                pdfCanvas.height = viewport.height;
                pdfCanvas.width = viewport.width;

                const renderContext = {
                    canvasContext: pdfCanvas.getContext('2d'),
                    viewport: viewport
                };
                const renderTask = page.render(renderContext);

                renderTask.promise.then(function () {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });

                if (continuousMode) {
                    textLayer.innerHTML = '';
                    page.getTextContent().then(function (textContent) {
                        const textLayerDiv = document.createElement('div');
                        textLayerDiv.style.position = 'absolute';
                        textLayerDiv.style.left = '0';
                        textLayerDiv.style.top = '0';
                        textLayerDiv.style.width = '100%';
                        textLayerDiv.style.height = '100%';
                        textLayerDiv.style.pointerEvents = 'none';
                        textLayerDiv.style.backgroundColor = 'rgba(255, 255, 255, 0.5)';
                        textLayer.appendChild(textLayerDiv);

                        const textLayerElements = [];
                        textContent.items.forEach(function (item) {
                            const textElementDiv = document.createElement('div');
                            textElementDiv.style.left = item.transform[4] + 'px';
                            textElementDiv.style.top = item.transform[5] + 'px';
                            textElementDiv.style.width = item.width + 'px';
                            textElementDiv.style.height = item.height + 'px';
                            textElementDiv.style.position = 'absolute';
                            textElementDiv.style.pointerEvents = 'none';
                            textElementDiv.style.backgroundColor = 'rgba(255, 255, 255, 0.5)';
                            textLayerElements.push(textElementDiv);
                        });

                        textLayerDiv.appendChild(textLayerElements);
                    });
                }
            });
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        function onPrevPage() {
            if (pageNum <= 1) {
                return;
            }
            pageNum--;
            queueRenderPage(pageNum);
        }

        function onNextPage() {
            if (pageNum >= pdfDoc.numPages) {
                return;
            }
            pageNum++;
            queueRenderPage(pageNum);
        }

        function onZoomIn() {
            scale += 0.15;
            queueRenderPage(pageNum);
        }

        function onZoomOut() {
            scale -= 0.15;
            if (scale < 0.15) {
                scale = 0.15;
            }
            queueRenderPage(pageNum);
        }

        function onContinuousMode() {
            continuousMode = !continuousMode;
            queueRenderPage(pageNum);
        }

        function loadPdf(url) {
            pdfjsLib.getDocument(url).promise.then(function (pdf) {
                pdfDoc = pdf;
                pageNum = 1;
                queueRenderPage(pageNum);
            });
        }

        function setContinuousMode(value) {
            continuousMode = value;
            queueRenderPage(pageNum);
        }

        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('prevPage').addEventListener('click', onPrevPage);
            document.getElementById('nextPage').addEventListener('click', onNextPage);
            document.getElementById('zoomIn').addEventListener('click', onZoomIn);
            document.getElementById('zoomOut').addEventListener('click', onZoomOut);
            document.getElementById('continuousMode').addEventListener('click', onContinuousMode);

            document.addEventListener('wheel', function (event) {
                if (event.ctrlKey) {
                    event.preventDefault();
                    if (event.deltaY < 0) {
                        onZoomIn();
                    } else {
                        onZoomOut();
                    }
                }
            });

            document.addEventListener('keydown', function (event) {
                if (event.ctrlKey) {
                    if (event.key === 'ArrowUp') {
                        onPrevPage();
                    } else if (event.key === 'ArrowDown') {
                        onNextPage();
                    }
                }
            });

            document.addEventListener('mousemove', function (event) {
                if (event.buttons === 1) {
                    const rect = pdfCanvas.getBoundingClientRect();
                    const dx = event.clientX - rect.left;
                    const dy = event.clientY - rect.top;
                    pdfCanvas.style.transform = `translate(${dx}px, ${dy}px)`;
                }
            });

            document.addEventListener('mouseup', function (event) {
                if (event.buttons === 1) {
                    pdfCanvas.style.transform = 'none';
                }
            });
        });
    </script>
</body>
</html>
