<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
    <!-- Brand palette and typography come from the site stylesheet. -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Viewer classes are prefixed so the site stylesheet (which styles its
           own .page elements) cannot affect the rendered PDF pages. */
        :root {
            --navy: #0e3a5b;
            --ink: #2b2b2b;
            --paper: #ffffff;
            --accent: #2e6da4;
            --viewer-bg: #ffffff;
            --page-border: #d9e5ee;
            --page-shadow: 0 2px 10px rgba(14, 58, 91, 0.10);
            --selection: rgba(46, 109, 164, 0.28);
            --page-gap: 22px;
            --page-padding: 22px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--viewer-bg);
            overflow: hidden;
        }

        body {
            font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
            color: var(--ink);
        }

        [hidden] {
            display: none !important;
        }

        /* Scroll container: native wheel, keyboard and scrollbar behaviour. */
        #viewer {
            position: absolute;
            inset: 0;
            overflow: auto;
            overscroll-behavior: contain;
            background: var(--viewer-bg);
            scrollbar-color: var(--accent) #eef4f9;
            outline: none;
        }

        #viewer::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        #viewer::-webkit-scrollbar-track {
            background: #eef4f9;
        }

        #viewer::-webkit-scrollbar-thumb {
            background: rgba(46, 109, 164, 0.75);
            border: 3px solid transparent;
            border-radius: 7px;
            background-clip: content-box;
        }

        #viewer::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
            background-clip: content-box;
        }

        /* safe centring keeps oversized pages scrollable instead of clipped. */
        #pages {
            display: flex;
            flex-direction: column;
            align-items: safe center;
            gap: var(--page-gap);
            min-height: 100%;
            padding: var(--page-padding);
        }

        #pages.single {
            justify-content: safe center;
        }

        .pdf-page {
            position: relative;
            flex: 0 0 auto;
            background: var(--paper);
            border: 1px solid var(--page-border);
            box-shadow: var(--page-shadow);
            overflow: hidden;
        }

        .pdf-page canvas {
            display: block;
        }

        /* PDF.js text layer: transparent, selectable text above the canvas. */
        .textLayer {
            position: absolute;
            inset: 0;
            z-index: 2;
            overflow: hidden;
            line-height: 1;
            text-align: initial;
            text-size-adjust: none;
            forced-color-adjust: none;
            transform-origin: 0 0;
        }

        .textLayer :is(span, br) {
            color: transparent;
            position: absolute;
            white-space: pre;
            cursor: text;
            transform-origin: 0% 0%;
        }

        .textLayer span.markedContent {
            top: 0;
            height: 0;
        }

        .textLayer ::selection {
            background: var(--selection);
        }

        .textLayer br::selection {
            background: transparent;
        }

        /* Empty state, styled after the site's dashed drop zone. */
        .pdf-empty {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            padding: 32px;
        }

        .pdf-empty-card {
            width: min(620px, 100%);
            text-align: center;
            border: 2px dashed var(--accent);
            border-radius: 8px;
            padding: 34px 40px;
            background: #f2f8fc;
        }

        .pdf-empty-title {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--navy);
            margin-bottom: 10px;
        }

        .pdf-empty-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #4a6274;
        }

        #dropOverlay {
            position: fixed;
            inset: 14px;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--accent);
            border-radius: 8px;
            background: rgba(242, 248, 252, 0.94);
            color: var(--navy);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }

        body.dragging #dropOverlay {
            opacity: 1;
        }

        #printContainer {
            display: none;
        }

        @media print {
            @page {
                margin: 0;
            }

            html,
            body {
                width: 100%;
                height: auto;
                margin: 0;
                padding: 0;
                background: var(--paper);
                overflow: visible;
            }

            body > *:not(#printContainer) {
                display: none !important;
            }

            #printContainer {
                display: block;
            }

            .pdf-print-page {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                height: 100vh;
                overflow: hidden;
                break-after: page;
                page-break-after: always;
            }

            .pdf-print-page:last-child {
                break-after: auto;
                page-break-after: auto;
            }

            .pdf-print-page canvas {
                width: auto;
                height: auto;
                max-width: 100%;
                max-height: 100%;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>
    <div id="viewer" tabindex="0">
        <div id="pages"></div>
    </div>

    <div id="empty" class="pdf-empty">
        <div class="pdf-empty-card">
            <div class="pdf-empty-title">Drop a PDF file here</div>
            <div class="pdf-empty-text">
                Open a PDF, drop one onto this window, or pass a file on the command line.
                In page mode the mouse wheel moves between pages.
            </div>
        </div>
    </div>

    <div id="dropOverlay"><span>Drop PDF to open</span></div>
    <div id="printContainer" aria-hidden="true"></div>

    <script src="pdfjs/pdf.min.js"></script>
    <script>
        const viewerEl = document.getElementById('viewer');
        const pagesEl = document.getElementById('pages');
        const emptyEl = document.getElementById('empty');
        const printContainer = document.getElementById('printContainer');

        const MIN_ZOOM = 0.25;
        const MAX_ZOOM = 4;
        const ZOOM_STEP = 0.15;
        const WHEEL_PAGE_THRESHOLD = 40;
        const WHEEL_PAGE_LOCK_MS = 320;
        const WHEEL_RESET_MS = 220;

        let pdfDoc = null;
        let currentPage = 1;
        // Zoom is a factor of the fit scale: 1 means the page fits the window.
        let zoom = 1;
        let fitScale = 1;
        let pageScale = 1;
        let continuous = false;
        let generation = 0;
        let loadToken = 0;
        let pageViews = [];
        const viewByElement = new Map();
        let observer = null;
        let printInProgress = false;
        let dragDepth = 0;
        let scrollScheduled = false;
        let lastStateKey = '';
        let resizeTimer = null;
        let wheelAccumulator = 0;
        let wheelResetTimer = null;
        let wheelLockUntil = 0;

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdfjs/pdf.worker.min.js';

        function notifyHost(message) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(message);
            }
        }

        function reportState(force) {
            const total = pdfDoc ? pdfDoc.numPages : 0;
            const key = `${currentPage}/${total}/${zoom}/${continuous}`;
            if (!force && key === lastStateKey) {
                return;
            }
            lastStateKey = key;
            notifyHost({ type: 'state', page: currentPage, total: total, zoom: zoom });
        }

        function reportStatus(text) {
            notifyHost({ type: 'status', text: text });
        }

        function reportDocument(name) {
            notifyHost({ type: 'document', name: name });
        }

        function clamp(value, min, max) {
            return Math.min(max, Math.max(min, value));
        }

        function showEmptyState() {
            emptyEl.hidden = false;
            pagesEl.hidden = true;
        }

        function showDocumentState() {
            emptyEl.hidden = true;
            pagesEl.hidden = false;
        }

        function viewerMetrics() {
            const styles = getComputedStyle(pagesEl);
            const padX = parseFloat(styles.paddingLeft) + parseFloat(styles.paddingRight);
            const padY = parseFloat(styles.paddingTop) + parseFloat(styles.paddingBottom);
            return {
                width: Math.max(80, viewerEl.clientWidth - padX - 2),
                height: Math.max(80, viewerEl.clientHeight - padY - 2)
            };
        }

        function cancelAndClearPages() {
            for (const view of pageViews) {
                if (view.renderTask) {
                    try {
                        view.renderTask.cancel();
                    } catch (error) {
                        // The render may already have finished.
                    }
                    view.renderTask = null;
                }
                if (view.textTask && typeof view.textTask.cancel === 'function') {
                    try {
                        view.textTask.cancel();
                    } catch (error) {
                        // The text layer may already have finished.
                    }
                }
                view.element.remove();
            }
            pageViews = [];
            viewByElement.clear();
            pagesEl.textContent = '';
        }

        function captureAnchor() {
            if (!continuous) {
                return null;
            }
            const view = pageViews.find(function (candidate) {
                return candidate.number === currentPage;
            });
            if (!view) {
                return null;
            }
            return {
                page: currentPage,
                offset: view.element.getBoundingClientRect().top - viewerEl.getBoundingClientRect().top
            };
        }

        function restoreAnchor(anchor) {
            if (!anchor || !continuous) {
                return;
            }
            const view = pageViews.find(function (candidate) {
                return candidate.number === anchor.page;
            });
            if (!view) {
                return;
            }
            const offset = view.element.getBoundingClientRect().top - viewerEl.getBoundingClientRect().top;
            viewerEl.scrollTop += offset - anchor.offset;
        }

        // Page mode fits the whole page in the window; continuous mode fits the
        // page width so scrolling stays natural.
        function computePageScale(sizes) {
            const metrics = viewerMetrics();
            if (continuous) {
                const widest = sizes.reduce(function (max, size) {
                    return Math.max(max, size.width);
                }, 1);
                return metrics.width / widest;
            }
            return Math.min(
                metrics.width / sizes[0].width,
                metrics.height / sizes[0].height);
        }

        async function rebuild(options) {
            const opts = options || {};
            const anchor = opts.anchor === false ? null : captureAnchor();
            const gen = ++generation;

            if (observer) {
                observer.disconnect();
                observer = null;
            }
            cancelAndClearPages();

            if (!pdfDoc) {
                showEmptyState();
                reportState(true);
                return;
            }

            showDocumentState();
            const total = pdfDoc.numPages;
            currentPage = clamp(currentPage, 1, total);
            const numbers = continuous
                ? Array.from({ length: total }, function (_, index) { return index + 1; })
                : [currentPage];
            pagesEl.classList.toggle('single', !continuous);

            let sizes;
            try {
                sizes = await Promise.all(numbers.map(async function (number) {
                    const page = await pdfDoc.getPage(number);
                    return page.getViewport({ scale: 1 });
                }));
            } catch (error) {
                if (gen === generation) {
                    console.error('Failed to read page sizes:', error);
                    showEmptyState();
                }
                return;
            }
            if (gen !== generation) {
                return;
            }

            fitScale = Math.max(0.05, computePageScale(sizes));
            pageScale = fitScale * zoom;

            numbers.forEach(function (number, index) {
                const base = sizes[index];
                const width = Math.max(1, Math.floor(base.width * pageScale));
                const height = Math.max(1, Math.floor(base.height * pageScale));

                const element = document.createElement('div');
                element.className = 'pdf-page';
                element.dataset.page = String(number);
                element.style.width = width + 'px';
                element.style.height = height + 'px';

                const canvas = document.createElement('canvas');
                const textLayer = document.createElement('div');
                textLayer.className = 'textLayer';
                element.appendChild(canvas);
                element.appendChild(textLayer);
                pagesEl.appendChild(element);

                const view = {
                    number: number,
                    element: element,
                    canvas: canvas,
                    textLayer: textLayer,
                    rendered: false,
                    rendering: false,
                    renderTask: null,
                    textTask: null,
                    gen: gen
                };
                pageViews.push(view);
                viewByElement.set(element, view);
            });

            restoreAnchor(anchor);
            if (!continuous) {
                viewerEl.scrollTop = 0;
            }

            if (typeof IntersectionObserver === 'function') {
                observer = new IntersectionObserver(function (entries) {
                    for (const entry of entries) {
                        if (!entry.isIntersecting) {
                            continue;
                        }
                        const view = viewByElement.get(entry.target);
                        if (view) {
                            renderPageView(view);
                        }
                    }
                }, { root: viewerEl, rootMargin: '600px 0px', threshold: 0 });
                pageViews.forEach(function (view) {
                    observer.observe(view.element);
                });
            } else {
                pageViews.forEach(renderPageView);
            }

            reportState(true);
        }

        async function renderPageView(view) {
            if (!pdfDoc || view.gen !== generation || view.rendered || view.rendering) {
                return;
            }
            view.rendering = true;

            try {
                const page = await pdfDoc.getPage(view.number);
                if (view.gen !== generation || !view.element.isConnected) {
                    return;
                }

                const viewport = page.getViewport({ scale: pageScale });
                const ratio = window.devicePixelRatio || 1;
                const canvas = view.canvas;

                canvas.width = Math.max(1, Math.round(viewport.width * ratio));
                canvas.height = Math.max(1, Math.round(viewport.height * ratio));
                canvas.style.width = view.element.style.width;
                canvas.style.height = view.element.style.height;

                const context = canvas.getContext('2d', { alpha: false });
                context.fillStyle = '#ffffff';
                context.fillRect(0, 0, canvas.width, canvas.height);

                const renderTask = page.render({
                    canvasContext: context,
                    viewport: viewport,
                    transform: ratio === 1 ? null : [ratio, 0, 0, ratio, 0, 0],
                    background: 'rgb(255, 255, 255)'
                });
                view.renderTask = renderTask;
                await renderTask.promise;
                view.renderTask = null;

                if (view.gen !== generation) {
                    return;
                }
                view.rendered = true;

                const textContent = await page.getTextContent();
                if (view.gen !== generation) {
                    return;
                }

                view.textLayer.textContent = '';
                view.textLayer.style.setProperty('--scale-factor', String(viewport.scale));

                try {
                    const textTask = pdfjsLib.renderTextLayer({
                        textContentSource: textContent,
                        container: view.textLayer,
                        viewport: viewport,
                        textDivs: []
                    });
                    view.textTask = textTask;
                    if (textTask && textTask.promise) {
                        await textTask.promise;
                    }
                } catch (error) {
                    if (!error || error.name !== 'RenderingCancelledException') {
                        console.error('Text layer failed on page ' + view.number + ':', error);
                    }
                } finally {
                    view.textTask = null;
                }
            } catch (error) {
                if (!error || error.name !== 'RenderingCancelledException') {
                    console.error('Failed to render page ' + view.number + ':', error);
                }
            } finally {
                view.renderTask = null;
                view.rendering = false;
            }
        }

        function updateVisiblePage() {
            if (!continuous || !pdfDoc || pageViews.length === 0) {
                return;
            }
            const viewerRect = viewerEl.getBoundingClientRect();
            const top = viewerRect.top;
            const bottom = viewerRect.bottom;
            let bestPage = currentPage;
            let bestVisible = 0;

            for (const view of pageViews) {
                const rect = view.element.getBoundingClientRect();
                const visible = Math.min(rect.bottom, bottom) - Math.max(rect.top, top);
                if (visible > bestVisible) {
                    bestVisible = visible;
                    bestPage = view.number;
                }
            }

            if (bestVisible > 0 && bestPage !== currentPage) {
                currentPage = bestPage;
                reportState();
            }
        }

        function scrollToCurrentPage() {
            const view = pageViews.find(function (candidate) {
                return candidate.number === currentPage;
            });
            if (!view) {
                return;
            }
            const offset = view.element.getBoundingClientRect().top
                - viewerEl.getBoundingClientRect().top
                + viewerEl.scrollTop
                - parseFloat(getComputedStyle(pagesEl).paddingTop);
            viewerEl.scrollTop = Math.max(0, offset);
            renderPageView(view);
        }

        function goToPage(number) {
            if (!pdfDoc) {
                return;
            }
            const next = clamp(number, 1, pdfDoc.numPages);
            if (next === currentPage && !continuous) {
                return;
            }
            currentPage = next;

            if (continuous) {
                const view = pageViews.find(function (candidate) {
                    return candidate.number === currentPage;
                });
                if (view) {
                    renderPageView(view);
                    scrollToCurrentPage();
                }
            } else {
                rebuild({ anchor: false });
            }
            reportState(true);
        }

        function setZoom(value) {
            const next = clamp(Math.round(value * 100) / 100, MIN_ZOOM, MAX_ZOOM);
            if (!pdfDoc || next === zoom) {
                return;
            }
            zoom = next;
            rebuild({ anchor: true });
            reportState(true);
        }

        // Functions called from the Windows host.
        function zoomIn() {
            setZoom(zoom + ZOOM_STEP);
        }

        function zoomOut() {
            setZoom(zoom - ZOOM_STEP);
        }

        function prevPage() {
            goToPage(currentPage - 1);
        }

        function nextPage() {
            goToPage(currentPage + 1);
        }

        async function setContinuousMode(value) {
            const next = !!value;
            if (next === continuous) {
                return;
            }
            continuous = next;
            await rebuild({ anchor: false });
            if (continuous) {
                scrollToCurrentPage();
            } else {
                viewerEl.scrollTop = 0;
            }
        }

        async function openPdfDocument(task, name) {
            const token = ++loadToken;
            reportStatus('Loading PDF…');

            try {
                const pdf = await task;
                if (token !== loadToken) {
                    try {
                        pdf.destroy();
                    } catch (error) {
                        // Ignore teardown failures for a superseded document.
                    }
                    return;
                }

                const previous = pdfDoc;
                pdfDoc = pdf;
                currentPage = 1;
                zoom = 1;
                await rebuild({ anchor: false });

                if (previous && previous !== pdf) {
                    try {
                        await previous.destroy();
                    } catch (error) {
                        // Ignore teardown failures.
                    }
                }

                reportState(true);
                reportStatus('Ready');
                if (name) {
                    reportDocument(name);
                }
            } catch (error) {
                if (token !== loadToken) {
                    return;
                }
                console.error('Failed to load PDF:', error);
                pdfDoc = null;
                await rebuild({ anchor: false });
                reportStatus(
                    error && error.name === 'PasswordException'
                        ? 'This PDF is password-protected'
                        : 'Could not open the PDF file');
            }
        }

        function loadPdf(url) {
            return openPdfDocument(pdfjsLib.getDocument({
                url: url,
                cMapUrl: 'pdfjs/cmaps/',
                cMapPacked: true,
                standardFontDataUrl: 'pdfjs/standard_fonts/'
            }).promise);
        }

        function loadPdfData(data, name) {
            return openPdfDocument(pdfjsLib.getDocument({
                data: data,
                cMapUrl: 'pdfjs/cmaps/',
                cMapPacked: true,
                standardFontDataUrl: 'pdfjs/standard_fonts/'
            }).promise, name);
        }

        function isPdfName(name) {
            return typeof name === 'string' && /\.pdf$/i.test(name);
        }

        function isPdfTransfer(dataTransfer) {
            if (!dataTransfer) {
                return false;
            }
            const files = dataTransfer.files;
            if (files && files.length > 0) {
                return Array.prototype.some.call(files, function (file) {
                    return isPdfName(file.name);
                });
            }
            const items = dataTransfer.items;
            return !!items && Array.prototype.some.call(items, function (item) {
                return item.kind === 'file';
            });
        }

        // Files dropped from Explorer are read here so the page stays in control
        // of the drop instead of the browser opening a second window.
        window.addEventListener('dragenter', function (event) {
            event.preventDefault();
            dragDepth++;
            if (isPdfTransfer(event.dataTransfer)) {
                document.body.classList.add('dragging');
            }
        });

        window.addEventListener('dragleave', function (event) {
            event.preventDefault();
            dragDepth = Math.max(0, dragDepth - 1);
            if (dragDepth === 0) {
                document.body.classList.remove('dragging');
            }
        });

        window.addEventListener('dragover', function (event) {
            event.preventDefault();
            if (event.dataTransfer) {
                event.dataTransfer.dropEffect = isPdfTransfer(event.dataTransfer) ? 'copy' : 'none';
            }
        });

        window.addEventListener('drop', async function (event) {
            event.preventDefault();
            event.stopPropagation();
            dragDepth = 0;
            document.body.classList.remove('dragging');

            const files = event.dataTransfer ? event.dataTransfer.files : null;
            if (!files || files.length === 0) {
                return;
            }

            const file = Array.prototype.find.call(files, function (candidate) {
                return isPdfName(candidate.name);
            });

            if (!file) {
                reportStatus('Drop a PDF file to open it');
                return;
            }

            try {
                const buffer = await file.arrayBuffer();
                await loadPdfData(new Uint8Array(buffer), file.name);
            } catch (error) {
                console.error('Failed to read dropped PDF:', error);
                reportStatus('Could not open the PDF file');
            }
        });

        viewerEl.addEventListener('scroll', function () {
            if (!continuous || scrollScheduled) {
                return;
            }
            scrollScheduled = true;
            requestAnimationFrame(function () {
                scrollScheduled = false;
                updateVisiblePage();
            });
        }, { passive: true });

        // Ctrl+wheel zooms. In page mode a plain wheel flips pages, which is the
        // page-by-page reading behaviour; continuous mode keeps native scrolling.
        window.addEventListener('wheel', function (event) {
            if (event.ctrlKey) {
                event.preventDefault();
                if (event.deltaY < 0) {
                    zoomIn();
                } else {
                    zoomOut();
                }
                return;
            }

            if (continuous || !pdfDoc) {
                return;
            }

            event.preventDefault();

            const now = performance.now();
            if (now < wheelLockUntil) {
                return;
            }

            const multiplier = event.deltaMode === 1 ? 16 : (event.deltaMode === 2 ? 100 : 1);
            wheelAccumulator += event.deltaY * multiplier;

            clearTimeout(wheelResetTimer);
            wheelResetTimer = setTimeout(function () {
                wheelAccumulator = 0;
            }, WHEEL_RESET_MS);

            if (Math.abs(wheelAccumulator) >= WHEEL_PAGE_THRESHOLD) {
                const direction = wheelAccumulator > 0 ? 1 : -1;
                wheelAccumulator = 0;
                wheelLockUntil = now + WHEEL_PAGE_LOCK_MS;
                goToPage(currentPage + direction);
            }
        }, { passive: false });

        // Re-fit the page when the window is resized.
        window.addEventListener('resize', function () {
            if (!pdfDoc) {
                return;
            }
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function () {
                resizeTimer = null;
                rebuild({ anchor: true });
                reportState(true);
            }, 140);
        });

        window.addEventListener('keydown', function (event) {
            if (event.ctrlKey && (event.key === 'p' || event.key === 'P')) {
                event.preventDefault();
                printPdf();
                return;
            }
            if (continuous || event.ctrlKey || event.altKey) {
                return;
            }
            if (event.key === 'PageDown' || event.key === 'ArrowDown' || event.key === 'ArrowRight' || event.key === ' ') {
                event.preventDefault();
                nextPage();
            } else if (event.key === 'PageUp' || event.key === 'ArrowUp' || event.key === 'ArrowLeft') {
                event.preventDefault();
                prevPage();
            }
        });

        async function preparePrintPages() {
            const totalPages = pdfDoc.numPages;

            // Lower resolutions for long documents keep memory use and print
            // preparation time under control.
            let dpi = 150;
            if (totalPages > 500) {
                dpi = 72;
            } else if (totalPages > 200) {
                dpi = 96;
            } else if (totalPages > 100) {
                dpi = 110;
            } else if (totalPages > 40) {
                dpi = 130;
            }

            const maxDimension = 3200;

            for (let number = 1; number <= totalPages; number++) {
                reportStatus(`Preparing to print page ${number} of ${totalPages}…`);

                const page = await pdfDoc.getPage(number);
                let viewport = page.getViewport({ scale: dpi / 72 });

                const longestSide = Math.max(viewport.width, viewport.height);
                if (longestSide > maxDimension) {
                    viewport = page.getViewport({
                        scale: (dpi / 72) * (maxDimension / longestSide)
                    });
                }

                const pageElement = document.createElement('div');
                pageElement.className = 'pdf-print-page';

                const canvas = document.createElement('canvas');
                canvas.width = Math.ceil(viewport.width);
                canvas.height = Math.ceil(viewport.height);
                canvas.setAttribute('aria-label', `Page ${number}`);

                pageElement.appendChild(canvas);
                printContainer.appendChild(pageElement);

                await page.render({
                    canvasContext: canvas.getContext('2d'),
                    viewport: viewport,
                    intent: 'print'
                }).promise;
            }
        }

        function exitPrintMode() {
            if (printContainer.childElementCount > 0) {
                printContainer.innerHTML = '';
            }
            printInProgress = false;
        }

        async function printPdf() {
            if (!pdfDoc || printInProgress) {
                return;
            }

            printInProgress = true;
            printContainer.innerHTML = '';

            try {
                await preparePrintPages();
                reportStatus('Opening print dialog…');

                // Let the browser lay out the print pages before opening the dialog.
                await new Promise(function (resolve) {
                    requestAnimationFrame(function () {
                        requestAnimationFrame(resolve);
                    });
                });

                window.print();
            } catch (error) {
                console.error('Failed to prepare the document for printing:', error);
                reportStatus('Could not prepare the document for printing');
            } finally {
                exitPrintMode();
                reportStatus('Ready');
            }
        }

        window.addEventListener('afterprint', exitPrintMode);

        showEmptyState();
        reportState(true);
    </script>
</body>
</html>
